name: Oracle Cron

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch oracle tick
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://cpi-oracle.vercel.app/api/cron
